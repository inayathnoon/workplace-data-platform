# ---------------------------------------------------------------------------
# Simulator configuration. Everything downstream is a function of this file.
#
# Every number in this repository is traceable to this config: the generator
# plants the effects declared here, and the pipeline's job is to recover them.
# Nothing here describes any real organisation.
# ---------------------------------------------------------------------------

seed: 20240917

# Active scale profile. Override with `WDP_PROFILE=full make data`.
profile: demo

profiles:
  # Runs end to end in well under three minutes on a laptop.
  demo:
    n_employees: 4_000
    n_days: 14
    n_cities: 8
    n_workplaces: 12
    end_date: "2025-06-30"

  # The size the brief describes. Generates ~35M badge taps; use Polars paths.
  full:
    n_employees: 120_000
    n_days: 180
    n_cities: 40
    n_workplaces: 150
    end_date: "2025-06-30"

